[project]
name = "barberus-api"
version = "0.1.0"
description = "API de Barberus (FastAPI, arquitectura hexagonal + DDD por contextos delimitados)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "supabase>=2.9",
    "pyjwt[crypto]>=2.9",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

# Proyecto de aplicación (servicio FastAPI), no una librería distribuible: sin
# [build-system]/[project.scripts] a propósito. `contextos/`, `nucleo/` y `main.py` viven
# directo bajo `api/` (sin layout `src/`), tal como fija la convención de contextos
# delimitados del agente `backend-fastapi` -- uv solo gestiona el entorno virtual y el lock
# de dependencias (`uv sync`, `uv run`), no empaqueta nada para publicar.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
